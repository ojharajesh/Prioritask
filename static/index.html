<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Prioritask</title>
  
  <!-- Apple Web App & Mobile Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Prioritask">
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="/manifest.json">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', '"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Plus Jakarta Sans", system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .custom-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .custom-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .task-enter {
      animation: iosSlideIn 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes iosSlideIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .ios-blur {
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
    }
  </style>
</head>
<body class="bg-[#f8f9fa] dark:bg-black text-slate-900 dark:text-zinc-100 min-h-screen flex flex-col antialiased selection:bg-indigo-500 selection:text-white transition-colors duration-200">

  <!-- iOS Minimalist Top Header -->
  <header class="sticky top-0 z-30 bg-[#f8f9fa]/90 dark:bg-black/85 ios-blur border-b border-slate-200/60 dark:border-white/[0.08] px-4 pt-3 pb-3">
    <div class="max-w-xl mx-auto flex items-center justify-between">
      <div>
        <div class="flex items-center gap-2">
          <h1 class="text-2xl font-bold tracking-tight text-slate-950 dark:text-white">Today</h1>
          <span id="active-badge" class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-indigo-100 dark:bg-indigo-500/20 text-indigo-600 dark:text-indigo-400">0 active</span>
        </div>
        <p id="system-time" class="text-[13px] text-slate-500 dark:text-zinc-400 font-medium mt-0.5">Sunday, Nov 22</p>
      </div>

      <div class="flex items-center gap-1.5">
        <!-- Quiet sync/refresh icon: force-reloads Home Screen icon to latest version -->
        <button onclick="forceReload()" title="Reload Latest Version" class="w-8 h-8 rounded-full flex items-center justify-center text-slate-400 hover:text-slate-700 dark:text-zinc-400 dark:hover:text-white hover:bg-slate-200/60 dark:hover:bg-white/10 transition active:scale-90">
          <i class="fa-solid fa-arrows-rotate text-xs"></i>
        </button>
        <!-- Dark mode switch -->
        <button onclick="toggleDarkMode()" class="w-8 h-8 rounded-full flex items-center justify-center text-slate-400 hover:text-slate-700 dark:text-zinc-400 dark:hover:text-white hover:bg-slate-200/60 dark:hover:bg-white/10 transition active:scale-90">
          <i id="theme-icon" class="fa-solid fa-moon text-xs"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Mobile Container -->
  <main class="flex-1 max-w-xl w-full mx-auto px-4 py-3.5 space-y-3.5">

    <!-- Today's Morning Snapshot (Apple Widget Style) -->
    <section id="morning-plan-card" class="hidden rounded-3xl bg-white dark:bg-[#141417] border border-slate-200/80 dark:border-white/[0.08] p-4 shadow-sm relative overflow-hidden transition-all duration-300">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-white/[0.06]">
        <div class="flex items-center gap-2.5">
          <div class="w-7 h-7 rounded-full bg-amber-500/15 text-amber-600 dark:text-amber-400 flex items-center justify-center text-xs">
            <i class="fa-solid fa-sun"></i>
          </div>
          <div>
            <h2 id="plan-title" class="text-xs font-bold uppercase tracking-wider text-slate-800 dark:text-zinc-200">Today's Focus</h2>
          </div>
        </div>
        <button onclick="togglePlanDetails()" class="text-slate-400 hover:text-slate-600 dark:hover:text-zinc-300 text-xs flex items-center gap-1 font-medium transition">
          <span id="plan-toggle-text">Details</span>
          <i id="plan-toggle-icon" class="fa-solid fa-chevron-down text-[10px]"></i>
        </button>
      </div>

      <!-- Compact Big 3 List -->
      <div class="pt-3 space-y-2">
        <div id="big-three-list" class="space-y-1.5">
          <!-- Big 3 focus items dynamically rendered here -->
        </div>

        <!-- Collapsible Details -->
        <div id="plan-breakdown" class="hidden pt-3 border-t border-slate-100 dark:border-white/[0.06] space-y-2 text-xs">
          <p id="plan-summary" class="text-slate-600 dark:text-zinc-400 leading-relaxed font-medium"></p>
          <div id="plan-tip" class="flex items-center gap-2 text-amber-700 dark:text-amber-400/90 bg-amber-500/10 p-2.5 rounded-2xl font-medium">
            <i class="fa-regular fa-lightbulb text-xs"></i>
            <span id="plan-tip-text"></span>
          </div>
        </div>
      </div>
    </section>

    <!-- Ultra-Clean Quick Add Bar (Apple / Linear style) -->
    <section class="rounded-2xl bg-white dark:bg-[#141417] border border-slate-200/80 dark:border-white/[0.08] shadow-sm p-2 transition-all">
      <form id="add-task-form" onsubmit="handleAddTask(event)" class="relative">
        <div class="relative flex items-center">
          <i class="fa-solid fa-plus text-slate-400 dark:text-zinc-400 text-sm ml-3 mr-2.5 pointer-events-none"></i>
          <input
            type="text"
            id="task-input"
            autocomplete="off"
            placeholder="Add task... (e.g. call CA Friday 4pm, high)"
            oninput="handleInputLivePreview(this.value)"
            class="w-full py-2 pr-10 bg-transparent text-[14px] text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-zinc-500 font-medium focus:outline-none"
          />
          <button
            type="submit"
            id="submit-task-btn"
            class="w-7 h-7 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white flex items-center justify-center transition active:scale-95 disabled:opacity-30 disabled:pointer-events-none flex-shrink-0"
          >
            <i class="fa-solid fa-arrow-up text-xs"></i>
          </button>
        </div>
      </form>

      <!-- Live Parser Chip Preview (Appears organically below input as you type) -->
      <div id="live-preview-box" class="hidden mt-2 pt-2 border-t border-slate-100 dark:border-white/[0.06] flex flex-wrap items-center gap-1.5 text-xs">
        <span class="text-[11px] uppercase font-bold text-slate-400 dark:text-zinc-500 mr-1">Parsed:</span>
        <span id="preview-title" class="px-2 py-0.5 rounded-md bg-slate-100 dark:bg-white/10 font-medium text-slate-800 dark:text-zinc-200"></span>
        <span id="preview-deadline" class="px-2 py-0.5 rounded-md bg-slate-100 dark:bg-white/10 font-medium text-indigo-600 dark:text-indigo-400 flex items-center gap-1"></span>
        <span id="preview-priority-badge" class="px-2 py-0.5 rounded-md font-bold uppercase text-[10px]"></span>
      </div>
    </section>

    <!-- iOS Native-Style Segmented Filter Tabs -->
    <div class="space-y-3 pt-0.5">
      <div class="flex items-center justify-between gap-2">
        <!-- Segmented Tab Picker -->
        <div class="flex items-center p-1 rounded-xl bg-slate-200/70 dark:bg-[#141417] border border-slate-200/80 dark:border-white/[0.06] text-[13px] font-semibold overflow-x-auto custom-scrollbar flex-1">
          <button onclick="setFilter('pending')" id="tab-pending" class="filter-tab flex-1 py-1.5 px-2.5 rounded-lg text-center transition whitespace-nowrap bg-white dark:bg-zinc-800 text-slate-900 dark:text-white shadow-sm">
            To-Do <span id="count-pending" class="text-[11px] opacity-75"></span>
          </button>
          <button onclick="setFilter('today')" id="tab-today" class="filter-tab flex-1 py-1.5 px-2.5 rounded-lg text-center transition whitespace-nowrap text-slate-600 dark:text-zinc-400 hover:text-slate-900 dark:hover:text-white">
            Today <span id="count-today" class="text-[11px] opacity-75"></span>
          </button>
          <button onclick="setFilter('tomorrow')" id="tab-tomorrow" class="filter-tab flex-1 py-1.5 px-2.5 rounded-lg text-center transition whitespace-nowrap text-slate-600 dark:text-zinc-400 hover:text-slate-900 dark:hover:text-white">
            Tomorrow <span id="count-tomorrow" class="text-[11px] opacity-75"></span>
          </button>
          <button onclick="setFilter('completed')" id="tab-completed" class="filter-tab flex-1 py-1.5 px-2.5 rounded-lg text-center transition whitespace-nowrap text-slate-600 dark:text-zinc-400 hover:text-slate-900 dark:hover:text-white">
            Done <span id="count-completed" class="text-[11px] opacity-75"></span>
          </button>
        </div>

        <!-- Sort Selector -->
        <div class="relative flex-shrink-0">
          <select
            id="sort-select"
            onchange="handleSortChange(this.value)"
            class="appearance-none bg-slate-200/70 dark:bg-[#141417] border border-slate-200/80 dark:border-white/[0.06] rounded-xl text-xs font-semibold pl-2.5 pr-6 py-2 text-slate-700 dark:text-zinc-300 focus:outline-none"
          >
            <option value="deadline_priority">Priority & Deadline</option>
            <option value="priority_deadline">Priority First</option>
            <option value="deadline_asc">Soonest First</option>
            <option value="created_desc">Newest Added</option>
          </select>
          <i class="fa-solid fa-arrow-down-short-wide absolute right-2 top-1/2 -translate-y-1/2 text-[10px] text-slate-400 dark:text-zinc-500 pointer-events-none"></i>
        </div>
      </div>

      <!-- Task Items List -->
      <div id="tasks-container" class="space-y-2">
        <!-- Rendered task cards -->
      </div>

      <!-- Empty State -->
      <div id="empty-state" class="hidden py-14 text-center rounded-3xl bg-white dark:bg-[#141417] border border-dashed border-slate-200 dark:border-white/[0.08] p-6">
        <div class="w-10 h-10 mx-auto rounded-full bg-slate-100 dark:bg-white/[0.05] flex items-center justify-center text-slate-400 dark:text-zinc-500 mb-2.5">
          <i class="fa-solid fa-circle-check text-base"></i>
        </div>
        <h3 class="text-sm font-bold text-slate-800 dark:text-zinc-200">All caught up!</h3>
        <p class="text-xs text-slate-500 dark:text-zinc-400 mt-0.5">Add a task above in plain English.</p>
      </div>
    </div>

  </main>

  <!-- Edit Task Modal -->
  <div id="edit-modal" class="fixed inset-0 z-50 bg-black/60 ios-blur hidden items-center justify-center p-4">
    <div class="bg-white dark:bg-[#18181c] rounded-3xl max-w-sm w-full p-5 border border-slate-200 dark:border-white/[0.1] shadow-2xl space-y-4">
      <div class="flex items-center justify-between">
        <h3 class="text-sm font-bold text-slate-900 dark:text-white">Edit Task</h3>
        <button onclick="closeEditModal()" class="w-7 h-7 rounded-full flex items-center justify-center text-slate-400 hover:text-slate-600 dark:hover:text-white">
          <i class="fa-solid fa-xmark text-xs"></i>
        </button>
      </div>

      <input type="hidden" id="edit-task-id">

      <div>
        <label class="block text-[10px] font-bold text-slate-400 dark:text-zinc-500 uppercase mb-1">Title</label>
        <input type="text" id="edit-task-title" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-zinc-800/80 border border-slate-200 dark:border-white/[0.08] text-xs font-semibold focus:outline-none focus:ring-1 focus:ring-indigo-500">
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-[10px] font-bold text-slate-400 dark:text-zinc-500 uppercase mb-1">Priority</label>
          <select id="edit-task-priority" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-zinc-800/80 border border-slate-200 dark:border-white/[0.08] text-xs font-semibold">
            <option value="high">High</option>
            <option value="medium">Medium</option>
            <option value="low">Low</option>
          </select>
        </div>
        <div>
          <label class="block text-[10px] font-bold text-slate-400 dark:text-zinc-500 uppercase mb-1">Status</label>
          <select id="edit-task-status" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-zinc-800/80 border border-slate-200 dark:border-white/[0.08] text-xs font-semibold">
            <option value="pending">Pending</option>
            <option value="completed">Completed</option>
          </select>
        </div>
      </div>

      <div>
        <label class="block text-[10px] font-bold text-slate-400 dark:text-zinc-500 uppercase mb-1">Deadline Date & Time</label>
        <input type="datetime-local" id="edit-task-deadline" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-zinc-800/80 border border-slate-200 dark:border-white/[0.08] text-xs font-semibold">
      </div>

      <div class="flex justify-end gap-2 pt-2">
        <button type="button" onclick="closeEditModal()" class="px-3 py-1.5 text-xs font-semibold text-slate-600 dark:text-zinc-400 rounded-xl hover:bg-slate-100 dark:hover:bg-zinc-800">Cancel</button>
        <button type="button" onclick="saveEditTask()" class="px-4 py-1.5 text-xs font-semibold bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl shadow-sm">Save</button>
      </div>
    </div>
  </div>

  <!-- Minimal iOS Notification Toast -->
  <div id="toast" class="fixed bottom-6 inset-x-0 mx-auto max-w-fit z-50 transform translate-y-16 opacity-0 transition-all duration-300 flex items-center gap-2 px-4 py-2 rounded-full bg-slate-900/90 dark:bg-zinc-800/90 text-white ios-blur shadow-lg border border-white/10 text-xs font-semibold pointer-events-none">
    <i id="toast-icon" class="fa-solid fa-circle-check text-emerald-400 text-xs"></i>
    <span id="toast-message">Task updated</span>
  </div>

  <!-- Application Logic -->
  <script>
    let currentFilter = 'pending';
    let currentSort = 'deadline_priority';
    let tasksList = [];
    let debounceTimer = null;

    // Local Storage helpers
    function saveLocalTasks(tasks) {
      try {
        localStorage.setItem('prioritask_tasks_v3', JSON.stringify(tasks));
      } catch (e) {}
    }

    function getLocalTasks() {
      try {
        const raw = localStorage.getItem('prioritask_tasks_v3');
        return raw ? JSON.parse(raw) : null;
      } catch (e) {
        return null;
      }
    }

    // App Initialization
    document.addEventListener('DOMContentLoaded', () => {
      initTheme();

      // Register Service Worker for instant 0.1s app launch from phone cache
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      }

      // Instant local render from device memory (zero network delay)
      const cached = getLocalTasks();
      if (cached && cached.length > 0) {
        tasksList = cached;
        updateTabBadges();
        filterAndRenderTasks();
      }

      fetchStatus();
      fetchTasks();
      fetchLatestPlan();
      setInterval(fetchStatus, 30000);
    });

    // Dark Mode
    function initTheme() {
      if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
        document.getElementById('theme-icon').className = 'fa-solid fa-sun text-xs';
      } else {
        document.documentElement.classList.remove('dark');
        document.getElementById('theme-icon').className = 'fa-solid fa-moon text-xs';
      }
    }

    function toggleDarkMode() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      document.getElementById('theme-icon').className = isDark ? 'fa-solid fa-sun text-xs' : 'fa-solid fa-moon text-xs';
    }

    // Toast
    function showToast(msg, icon = 'fa-circle-check text-emerald-400') {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toast-message');
      const toastIcon = document.getElementById('toast-icon');

      toastMsg.textContent = msg;
      toastIcon.className = `fa-solid ${icon}`;
      toast.classList.remove('translate-y-16', 'opacity-0');

      setTimeout(() => {
        toast.classList.add('translate-y-16', 'opacity-0');
      }, 2500);
    }

    // Tab badges
    function updateTabBadges() {
      const pendingCount = tasksList.filter(t => t.status === 'pending').length;
      const completedCount = tasksList.filter(t => t.status === 'completed').length;

      const todayStr = new Date().toDateString();
      const todayCount = tasksList.filter(t => {
        if (t.status === 'completed') return false;
        if (!t.deadline_dt) return true;
        const d = new Date(t.deadline_dt);
        return d.toDateString() === todayStr || d < new Date();
      }).length;

      const tomorrowDate = new Date();
      tomorrowDate.setDate(tomorrowDate.getDate() + 1);
      const tomorrowStr = tomorrowDate.toDateString();
      const tomorrowCount = tasksList.filter(t => {
        if (t.status === 'completed') return false;
        if (!t.deadline_dt) return false;
        return new Date(t.deadline_dt).toDateString() === tomorrowStr;
      }).length;

      const countPendingEl = document.getElementById('count-pending');
      const countTodayEl = document.getElementById('count-today');
      const countTomorrowEl = document.getElementById('count-tomorrow');
      const countCompletedEl = document.getElementById('count-completed');
      const activeBadgeEl = document.getElementById('active-badge');

      if (countPendingEl) countPendingEl.textContent = `(${pendingCount})`;
      if (countTodayEl) countTodayEl.textContent = `(${todayCount})`;
      if (countTomorrowEl) countTomorrowEl.textContent = `(${tomorrowCount})`;
      if (countCompletedEl) countCompletedEl.textContent = `(${completedCount})`;
      if (activeBadgeEl) activeBadgeEl.textContent = `${pendingCount} active`;
    }

    // Status
    async function fetchStatus() {
      try {
        const res = await fetch('/api/status');
        const data = await res.json();
        document.getElementById('system-time').textContent = data.local_time_display;
      } catch (err) {}
    }

    // Fetch and Sync
    async function fetchTasks() {
      try {
        const res = await fetch(`/api/tasks?sort_by=${currentSort}&status=all`);
        const data = await res.json();
        const serverTasks = data.tasks || [];

        const localTasks = getLocalTasks() || [];
        const localMap = new Map(localTasks.map(t => [t.id, t]));

        let merged = [];
        let needsSync = false;

        if (serverTasks.length === 0 && localTasks.length > 0) {
          merged = localTasks;
          needsSync = true;
        } else {
          merged = serverTasks.map(st => {
            const lt = localMap.get(st.id);
            if (lt && lt.status === 'completed' && st.status !== 'completed') {
              needsSync = true;
              return { ...st, status: 'completed' };
            }
            return st;
          });

          const serverIds = new Set(serverTasks.map(t => t.id));
          for (const lt of localTasks) {
            if (!serverIds.has(lt.id)) {
              merged.push(lt);
              needsSync = true;
            }
          }
        }

        tasksList = merged;
        saveLocalTasks(tasksList);
        updateTabBadges();
        filterAndRenderTasks();

        if (needsSync) {
          syncToServer(tasksList);
        }
      } catch (err) {
        const cached = getLocalTasks();
        if (cached) {
          tasksList = cached;
          updateTabBadges();
          filterAndRenderTasks();
        }
      }
    }

    async function syncToServer(tasks) {
      try {
        await fetch('/api/tasks/sync', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tasks })
        });
      } catch (e) {}
    }

    // Filter and Render
    function filterAndRenderTasks() {
      let filtered = [...tasksList];
      const todayStr = new Date().toDateString();
      const tomorrowDate = new Date();
      tomorrowDate.setDate(tomorrowDate.getDate() + 1);
      const tomorrowStr = tomorrowDate.toDateString();

      if (currentFilter === 'pending') {
        filtered = filtered.filter(t => t.status === 'pending');
      } else if (currentFilter === 'completed') {
        filtered = filtered.filter(t => t.status === 'completed');
      } else if (currentFilter === 'today') {
        filtered = filtered.filter(t => {
          if (t.status === 'completed') return false;
          if (!t.deadline_dt) return true;
          const d = new Date(t.deadline_dt);
          return d.toDateString() === todayStr || d < new Date();
        });
      } else if (currentFilter === 'tomorrow') {
        filtered = filtered.filter(t => {
          if (t.status === 'completed') return false;
          if (!t.deadline_dt) return false;
          return new Date(t.deadline_dt).toDateString() === tomorrowStr;
        });
      }

      // Sort
      if (currentSort === 'priority_deadline') {
        filtered.sort((a, b) => (b.priority_score || 2) - (a.priority_score || 2));
      } else if (currentSort === 'deadline_asc') {
        filtered.sort((a, b) => (a.deadline_dt || '9999') > (b.deadline_dt || '9999') ? 1 : -1);
      } else if (currentSort === 'created_desc') {
        filtered.sort((a, b) => (b.created_at || '') > (a.created_at || '') ? 1 : -1);
      } else { // 'deadline_priority'
        filtered.sort((a, b) => {
          if (a.status !== b.status) return a.status === 'completed' ? 1 : -1;
          const dlA = a.deadline_dt || '9999';
          const dlB = b.deadline_dt || '9999';
          if (dlA !== dlB) return dlA > dlB ? 1 : -1;
          return (b.priority_score || 2) - (a.priority_score || 2);
        });
      }

      renderTasks(filtered);
    }

    // Render Cards
    function renderTasks(tasks) {
      const container = document.getElementById('tasks-container');
      const emptyState = document.getElementById('empty-state');
      container.innerHTML = '';

      if (!tasks || tasks.length === 0) {
        emptyState.classList.remove('hidden');
        return;
      }
      emptyState.classList.add('hidden');

      tasks.forEach(task => {
        const card = document.createElement('div');
        const isDone = task.status === 'completed';
        card.id = `task-card-${task.id}`;
        card.className = `task-enter rounded-2xl p-3 bg-white dark:bg-[#141417] border transition-all duration-200 flex items-center justify-between gap-3 ${
          isDone
            ? 'opacity-40 bg-slate-50 dark:bg-zinc-900/40 border-slate-200/50 dark:border-white/[0.03]'
            : 'border-slate-200/80 dark:border-white/[0.08] shadow-sm hover:border-indigo-400 dark:hover:border-zinc-700'
        }`;

        // Priority subtle tag
        let prioDot = '';
        if (task.priority === 'high') {
          prioDot = `<span class="inline-flex items-center gap-1 text-[10px] font-bold uppercase tracking-wider text-rose-600 dark:text-rose-400 bg-rose-50 dark:bg-rose-950/60 px-1.5 py-0.5 rounded-md border border-rose-200/60 dark:border-rose-900/60">High</span>`;
        } else if (task.priority === 'low') {
          prioDot = `<span class="inline-flex items-center text-[10px] font-semibold text-slate-500 dark:text-zinc-400 bg-slate-100 dark:bg-white/[0.06] px-1.5 py-0.5 rounded-md">Low</span>`;
        } else {
          prioDot = `<span class="inline-flex items-center text-[10px] font-semibold text-amber-600 dark:text-amber-400 bg-amber-50 dark:bg-amber-950/60 px-1.5 py-0.5 rounded-md border border-amber-200/60 dark:border-amber-900/60">Med</span>`;
        }

        // Deadline label
        let deadlineLabel = '';
        if (task.deadline_dt) {
          const deadlineObj = new Date(task.deadline_dt);
          const nowObj = new Date();
          const isOverdue = !isDone && deadlineObj < nowObj;
          const isToday = deadlineObj.toDateString() === nowObj.toDateString();
          const tomorrowObj = new Date();
          tomorrowObj.setDate(nowObj.getDate() + 1);
          const isTomorrow = deadlineObj.toDateString() === tomorrowObj.toDateString();

          let timeStr = task.has_time ? deadlineObj.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : '';

          let dateLabel = '';
          if (isToday) dateLabel = 'Today' + (timeStr ? ` ${timeStr}` : '');
          else if (isTomorrow) dateLabel = 'Tomorrow' + (timeStr ? ` ${timeStr}` : '');
          else dateLabel = deadlineObj.toLocaleDateString([], { month: 'short', day: 'numeric' }) + (timeStr ? ` ${timeStr}` : '');

          if (isOverdue) {
            deadlineLabel = `<span class="inline-flex items-center gap-1 text-[11px] font-semibold text-rose-500 dark:text-rose-400"><i class="fa-solid fa-clock text-[10px]"></i> Overdue (${dateLabel})</span>`;
          } else if (isToday) {
            deadlineLabel = `<span class="inline-flex items-center gap-1 text-[11px] font-medium text-amber-600 dark:text-amber-400"><i class="fa-regular fa-clock text-[10px]"></i> ${dateLabel}</span>`;
          } else {
            deadlineLabel = `<span class="inline-flex items-center gap-1 text-[11px] font-medium text-slate-500 dark:text-zinc-400">${dateLabel}</span>`;
          }
        }

        // Rolled over badge
        let rolledTag = '';
        if (task.rolled_over_count > 0 && !isDone) {
          rolledTag = `<span class="text-[10px] font-medium text-purple-600 dark:text-purple-400 bg-purple-50 dark:bg-purple-950/50 px-1.5 py-0.5 rounded-md border border-purple-200/50 dark:border-purple-900/50">↺ ${task.rolled_over_count}x</span>`;
        }

        card.innerHTML = `
          <div class="flex items-center gap-3 flex-1 min-w-0">
            <!-- iOS Circular Checkbox -->
            <button
              onclick="toggleTaskStatus(${task.id}, '${task.status}')"
              class="w-[24px] h-[24px] rounded-full border-[1.5px] flex items-center justify-center flex-shrink-0 transition-all ${
                isDone
                  ? 'bg-emerald-500 border-emerald-500 text-white'
                  : 'border-slate-300 dark:border-zinc-600 hover:border-indigo-500 text-transparent'
              }"
            >
              <i class="fa-solid fa-check text-[10px]"></i>
            </button>

            <!-- Task Description & Meta -->
            <div class="min-w-0 flex-1">
              <div class="text-[15px] font-semibold tracking-tight leading-snug truncate ${isDone ? 'line-through text-slate-400 dark:text-zinc-500' : 'text-slate-900 dark:text-white'}">
                ${escapeHtml(task.title)}
              </div>
              <div class="flex flex-wrap items-center gap-2 mt-1">
                ${prioDot}
                ${deadlineLabel}
                ${rolledTag}
              </div>
            </div>
          </div>

          <!-- Subtle Action Buttons -->
          <div class="flex items-center gap-0.5 flex-shrink-0">
            <button onclick="openEditModal(${task.id})" class="w-7 h-7 rounded-lg flex items-center justify-center text-slate-400 hover:text-slate-700 dark:hover:text-zinc-200 hover:bg-slate-100 dark:hover:bg-white/10 transition">
              <i class="fa-regular fa-pen-to-square text-[11px]"></i>
            </button>
            <button onclick="deleteTaskItem(${task.id})" class="w-7 h-7 rounded-lg flex items-center justify-center text-slate-400 hover:text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-950/40 transition">
              <i class="fa-regular fa-trash-can text-[11px]"></i>
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Input preview
    function handleInputLivePreview(text) {
      clearTimeout(debounceTimer);
      const previewBox = document.getElementById('live-preview-box');

      if (!text || text.trim().length < 2) {
        previewBox.classList.add('hidden');
        return;
      }

      debounceTimer = setTimeout(async () => {
        try {
          const res = await fetch('/api/tasks/parse', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ text })
          });
          const parsed = await res.json();

          if (!parsed.title && !parsed.deadline_dt) {
            previewBox.classList.add('hidden');
            return;
          }

          document.getElementById('preview-title').textContent = parsed.title || text;

          let dlStr = 'Today';
          if (parsed.deadline_dt) {
            const d = new Date(parsed.deadline_dt);
            const timeStr = parsed.has_time ? d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : '';
            dlStr = d.toLocaleDateString([], { month: 'short', day: 'numeric' }) + (timeStr ? ` ${timeStr}` : '');
          }
          document.getElementById('preview-deadline').innerHTML = `<i class="fa-regular fa-clock text-[9px]"></i> ${dlStr}`;

          const prioEl = document.getElementById('preview-priority-badge');
          prioEl.textContent = parsed.priority.toUpperCase();
          if (parsed.priority === 'high') {
            prioEl.className = 'px-1.5 py-0.5 rounded-md font-bold uppercase text-[10px] bg-rose-100 dark:bg-rose-950 text-rose-700 dark:text-rose-300';
          } else if (parsed.priority === 'low') {
            prioEl.className = 'px-1.5 py-0.5 rounded-md font-bold uppercase text-[10px] bg-slate-200 dark:bg-zinc-800 text-slate-700 dark:text-zinc-300';
          } else {
            prioEl.className = 'px-1.5 py-0.5 rounded-md font-bold uppercase text-[10px] bg-amber-100 dark:bg-amber-950 text-amber-700 dark:text-amber-300';
          }

          previewBox.classList.remove('hidden');
        } catch (e) {}
      }, 150);
    }

    // Add Task
    async function handleAddTask(e) {
      e.preventDefault();
      const input = document.getElementById('task-input');
      const text = input.value.trim();
      if (!text) return;

      const submitBtn = document.getElementById('submit-task-btn');
      submitBtn.disabled = true;

      try {
        const res = await fetch('/api/tasks', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ raw_text: text })
        });
        const data = await res.json();
        if (data.success) {
          input.value = '';
          document.getElementById('live-preview-box').classList.add('hidden');
          showToast(`Added: ${data.task.title}`);
          tasksList.unshift(data.task);
          saveLocalTasks(tasksList);
          updateTabBadges();
          filterAndRenderTasks();
          fetchStatus();
        }
      } catch (err) {
        showToast('Error adding task', 'fa-circle-xmark text-rose-400');
      } finally {
        submitBtn.disabled = false;
        input.focus();
      }
    }

    // Toggle Task Status
    async function toggleTaskStatus(id, currentStatus) {
      const newStatus = currentStatus === 'completed' ? 'pending' : 'completed';

      const task = tasksList.find(t => t.id === id);
      if (task) {
        task.status = newStatus;
        task.completed_at = newStatus === 'completed' ? new Date().toISOString() : null;
      }
      saveLocalTasks(tasksList);
      updateTabBadges();

      const card = document.getElementById(`task-card-${id}`);
      if (card && currentFilter === 'pending' && newStatus === 'completed') {
        card.style.transition = 'all 0.22s ease';
        card.style.opacity = '0.2';
        card.style.transform = 'scale(0.96)';
        setTimeout(() => {
          filterAndRenderTasks();
        }, 220);
      } else {
        filterAndRenderTasks();
      }

      showToast(newStatus === 'completed' ? 'Completed! Moved to Done.' : 'Reopened');

      try {
        await fetch(`/api/tasks/${id}`, {
          method: 'PUT',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ status: newStatus })
        });
      } catch (e) {}
      fetchStatus();
    }

    // Delete Task
    async function deleteTaskItem(id) {
      if (!confirm('Delete this task?')) return;
      tasksList = tasksList.filter(t => t.id !== id);
      saveLocalTasks(tasksList);
      updateTabBadges();
      filterAndRenderTasks();
      showToast('Task deleted');
      try {
        await fetch(`/api/tasks/${id}`, { method: 'DELETE' });
      } catch (e) {}
      fetchStatus();
    }

    // Filter Change
    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-tab').forEach(btn => {
        btn.className = 'filter-tab flex-1 py-1 px-2.5 rounded-lg text-center transition whitespace-nowrap text-slate-600 dark:text-zinc-400 hover:text-slate-900 dark:hover:text-white';
      });
      const activeBtn = document.getElementById(`tab-${filter}`);
      if (activeBtn) {
        activeBtn.className = 'filter-tab flex-1 py-1 px-2.5 rounded-lg text-center transition whitespace-nowrap bg-white dark:bg-zinc-800 text-slate-900 dark:text-white shadow-sm';
      }
      filterAndRenderTasks();
    }

    function handleSortChange(sortVal) {
      currentSort = sortVal;
      filterAndRenderTasks();
    }

    function forceReload() {
      showToast('Refreshing latest version...', 'fa-arrows-rotate text-indigo-400');
      setTimeout(() => {
        window.location.href = window.location.origin + '/?refresh=' + Date.now();
      }, 250);
    }

    // Rollover
    async function triggerRollover(manual = false) {
      try {
        const res = await fetch('/api/plans/rollover', { method: 'POST' });
        const data = await res.json();
        if (data.success) {
          showToast(`Rollover updated (${data.plan.rolled_tasks_count} rolled)`, 'fa-moon text-indigo-400');
          renderMorningPlan(data.plan);
          fetchTasks();
          fetchStatus();
        }
      } catch (e) {}
    }

    // Fetch Plan
    async function fetchLatestPlan() {
      try {
        const res = await fetch('/api/plans/latest');
        const data = await res.json();
        if (data.plan) {
          renderMorningPlan(data.plan);
        }
      } catch (e) {}
    }

    // Render Morning Plan
    function renderMorningPlan(plan) {
      if (!plan) return;
      const card = document.getElementById('morning-plan-card');
      card.classList.remove('hidden');

      const dateLabel = plan.date_formatted || plan.day_name || 'Today';
      document.getElementById('plan-title').textContent = `Morning Focus • ${dateLabel}`;
      document.getElementById('plan-summary').textContent = plan.summary;
      document.getElementById('plan-tip-text').textContent = plan.tip || 'Tackle your high-priority items before noon.';

      const bigThreeList = document.getElementById('big-three-list');
      bigThreeList.innerHTML = '';
      if (plan.big_three && plan.big_three.length > 0) {
        plan.big_three.forEach((item, idx) => {
          const prioLabel = item.priority === 'high' ? 'High' : (item.priority === 'low' ? 'Low' : 'Med');
          const prioStyle = item.priority === 'high'
            ? 'bg-rose-100 text-rose-700 dark:bg-rose-950 dark:text-rose-300'
            : (item.priority === 'low'
              ? 'bg-slate-200 dark:bg-zinc-800 text-slate-600 dark:text-zinc-400'
              : 'bg-amber-100 text-amber-700 dark:bg-amber-950 dark:text-amber-300');

          const div = document.createElement('div');
          div.className = 'flex items-center gap-2.5 p-2 rounded-xl bg-slate-50 dark:bg-white/[0.04] border border-slate-200/50 dark:border-white/[0.04]';
          div.innerHTML = `
            <span class="w-5 h-5 rounded-full bg-indigo-600 text-white font-bold flex items-center justify-center text-[10px] flex-shrink-0">${idx + 1}</span>
            <span class="text-[14px] font-semibold text-slate-900 dark:text-white truncate flex-1">${escapeHtml(item.title)}</span>
            <span class="text-[10px] font-bold uppercase px-2 py-0.5 rounded-md flex-shrink-0 ${prioStyle}">${prioLabel}</span>
          `;
          bigThreeList.appendChild(div);
        });
      }
    }

    function togglePlanDetails() {
      const breakdown = document.getElementById('plan-breakdown');
      const toggleText = document.getElementById('plan-toggle-text');
      const toggleIcon = document.getElementById('plan-toggle-icon');

      if (breakdown.classList.contains('hidden')) {
        breakdown.classList.remove('hidden');
        toggleText.textContent = 'Hide';
        toggleIcon.className = 'fa-solid fa-chevron-up text-[10px]';
      } else {
        breakdown.classList.add('hidden');
        toggleText.textContent = 'Details';
        toggleIcon.className = 'fa-solid fa-chevron-down text-[10px]';
      }
    }

    // Modal Edit
    function openEditModal(taskId) {
      const task = tasksList.find(t => t.id === taskId);
      if (!task) return;

      document.getElementById('edit-task-id').value = task.id;
      document.getElementById('edit-task-title').value = task.title;
      document.getElementById('edit-task-priority').value = task.priority;
      document.getElementById('edit-task-status').value = task.status;

      if (task.deadline_dt) {
        const dt = new Date(task.deadline_dt);
        const isoLocal = new Date(dt.getTime() - dt.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
        document.getElementById('edit-task-deadline').value = isoLocal;
      } else {
        document.getElementById('edit-task-deadline').value = '';
      }

      const modal = document.getElementById('edit-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeEditModal() {
      const modal = document.getElementById('edit-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    async function saveEditTask() {
      const id = document.getElementById('edit-task-id').value;
      const title = document.getElementById('edit-task-title').value.trim();
      const priority = document.getElementById('edit-task-priority').value;
      const status = document.getElementById('edit-task-status').value;
      const deadlineVal = document.getElementById('edit-task-deadline').value;

      let deadline_dt = null;
      let has_time = false;
      if (deadlineVal) {
        const d = new Date(deadlineVal);
        deadline_dt = d.getFullYear() + '-' +
          String(d.getMonth() + 1).padStart(2, '0') + '-' +
          String(d.getDate()).padStart(2, '0') + ' ' +
          String(d.getHours()).padStart(2, '0') + ':' +
          String(d.getMinutes()).padStart(2, '0') + ':00';
        has_time = true;
      }

      const task = tasksList.find(t => String(t.id) === String(id));
      if (task) {
        task.title = title;
        task.priority = priority;
        task.status = status;
        task.deadline_dt = deadline_dt;
        task.has_time = has_time;
      }
      saveLocalTasks(tasksList);
      updateTabBadges();
      filterAndRenderTasks();
      closeEditModal();
      showToast('Task updated');

      try {
        await fetch(`/api/tasks/${id}`, {
          method: 'PUT',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            title,
            priority,
            status,
            deadline_dt,
            has_time
          })
        });
      } catch (e) {}
      fetchStatus();
    }

    function escapeHtml(text) {
      if (!text) return '';
      const map = {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'};
      return text.replace(/[&<>"']/g, m => map[m]);
    }
  </script>
</body>
